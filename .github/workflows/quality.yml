name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint English index
        run: npx --yes awesome-lint@2.2.3 README.md

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.17.2 '**/*.md'

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --verbose
            --exclude '^https://www\.npmjs\.com/'
            README.md
            README.zh-CN.md
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
          fail: true
